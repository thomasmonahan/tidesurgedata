[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tidesurgedata"
dynamic = ["version"]
description = "One consistent way to get tide gauge, river and meteorological data from many providers, and to assemble it into training and forecast datasets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Monahan" }]
keywords = ["tides", "storm surge", "sea level", "hydrology", "meteorology", "forecasting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "pandas>=2.2",
    "requests",
    "pyarrow",
    "pystac",
    "pytest-recording",
    "icechunk",
    "zarr",
    "xarray",
    "matplotlib"
]

[project.optional-dependencies]
# dataretrieval.waterdata first ships in dataretrieval 1.1.0.
usgs = ["dataretrieval>=1.1.0"]
met = ["xarray", "zarr>=3", "icechunk"]
xarray = ["xarray", "netCDF4"]
all = ["tidesurgedata[usgs,met,xarray]"]
test = ["pytest", "pytest-socket", "pytest-recording", "vcrpy", "pyyaml"]
dev = ["tidesurgedata[all,test]", "ruff", "pre-commit"]

[project.urls]
Repository = "https://github.com/thomasmonahan/tidesurgedata"

[tool.hatch.version]
path = "src/tidesurgedata/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tidesurgedata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: real network access; nightly job only",
    "rtide: RTide compatibility job only",
    "vcr: idk",
    "enable_socket: aslo idk"
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.format]
