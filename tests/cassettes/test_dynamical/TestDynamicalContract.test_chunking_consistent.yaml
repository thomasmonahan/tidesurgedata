    body:
      string: "{\n  \"type\": \"Collection\",\n  \"id\": \"noaa-gfs-analysis\",\n
        \ \"stac_version\": \"1.1.0\",\n  \"description\": \"Weather analysis from
        the Global Forecast System (GFS) operated by NOAA NWS NCEP.\",\n  \"links\":
        [\n    {\n      \"rel\": \"root\",\n      \"href\": \"https://stac.dynamical.org/catalog.json\",\n
        \     \"type\": \"application/json\",\n      \"title\": \"dynamical.org STAC
        Catalog\"\n    },\n    {\n      \"rel\": \"license\",\n      \"href\": \"https://creativecommons.org/licenses/by/4.0/\",\n
        \     \"type\": \"text/html\",\n      \"title\": \"CC-BY-4.0\"\n    },\n    {\n
        \     \"rel\": \"about\",\n      \"href\": \"https://dynamical.org/catalog/noaa-gfs-analysis/\",\n
        \     \"type\": \"text/html\",\n      \"title\": \"Dataset documentation\"\n
        \   },\n    {\n      \"rel\": \"about\",\n      \"href\": \"https://dynamical.org/catalog/noaa-gfs-analysis/validation/\",\n
        \     \"type\": \"text/html\",\n      \"title\": \"Validation report\"\n    },\n
        \   {\n      \"rel\": \"example\",\n      \"href\": \"https://github.com/dynamical-org/notebooks/blob/main/noaa-gfs-analysis.ipynb\",\n
        \     \"type\": \"application/x-ipynb+json\",\n      \"title\": \"Quickstart
        (GitHub)\"\n    },\n    {\n      \"rel\": \"example\",\n      \"href\": \"https://colab.research.google.com/github/dynamical-org/notebooks/blob/main/noaa-gfs-analysis.ipynb\",\n
        \     \"type\": \"text/html\",\n      \"title\": \"Quickstart (Colab)\"\n
        \   },\n    {\n      \"rel\": \"self\",\n      \"href\": \"https://stac.dynamical.org/noaa-gfs-analysis/collection.json\",\n
        \     \"type\": \"application/json\",\n      \"title\": \"NOAA GFS analysis\"\n
        \   },\n    {\n      \"rel\": \"parent\",\n      \"href\": \"https://stac.dynamical.org/catalog.json\",\n
        \     \"type\": \"application/json\",\n      \"title\": \"dynamical.org STAC
        Catalog\"\n    }\n  ],\n  \"stac_extensions\": [\n    \"https://stac-extensions.github.io/xarray-assets/v1.0.0/schema.json\",\n
        \   \"https://stac-extensions.github.io/datacube/v2.2.0/schema.json\"\n  ],\n
        \ \"attribution\": \"NOAA NWS NCEP GFS data processed by dynamical.org from
        NOAA Open Data Dissemination archives.\",\n  \"version\": \"0.1.0\",\n  \"model_id\":
        \"noaa-gfs\",\n  \"model_name\": \"NOAA GFS\",\n  \"description_summary\":
        \"This analysis dataset is an archive of the model's best estimate of past
        weather. It is created by concatenating the first few hours of each historical
        forecast to provide a dataset with dimensions time, latitude, and longitude.\",\n
        \ \"description_details\": \"### Construction\\n\\nGFS starts a new model
        run every 6 hours and dynamical.org has created this analysis by concatenating
        the first 6 hours of each forecast along the time dimension.\\n\\n### Source\\n\\nThe
        source grib files this archive is constructed from are provided by [NOAA Open
        Data Dissemination (NODD)](https://www.noaa.gov/information-technology/open-data-dissemination)
        and accessed from the [AWS Open Data Registry](https://registry.opendata.aws/noaa-gfs-bdp-pds/).
        Operational data is additionally accessed from [NOAA NOMADS](https://nomads.ncep.noaa.gov/).\\n\\n###
        Storage\\n\\nStorage for this dataset is generously provided by [Source Cooperative](https://source.coop/),
        a [Radiant Earth](https://radiant.earth/) initiative. Icechunk storage generously
        provided by [AWS Open Data](https://aws.amazon.com/opendata/).\\n\\n### Chunks
        & shards\\n\\nThis dataset is stored in [Zarr](https://zarr.dev/) format,
        which splits each variable into a grid of **chunks** \\u2014 the smallest
        unit read from storage. Chunks are grouped into larger **shards** (the objects
        actually written to storage), which keeps the object count manageable for
        long-archive datasets. When possible, aligning your reads with this dataset's
        chunk grid can significantly improve data access speed.\\n\\nThe element count
        and coordinate span of this dataset:\\n\\n| dimension | chunk | shard |\\n|---|---|---|\\n|
        time | 1440 (60 days) | 1440 (60 days) |\\n| latitude | 50 (12.5\\u00b0) |
        400 (100\\u00b0) |\\n| longitude | 50 (12.5\\u00b0) | 400 (100\\u00b0) |\\n|
        **uncompressed** | 13.7 MiB | 878.9 MiB |\\n\\n### Validation report\\n\\nReview
        the [validation report](https://dynamical.org/catalog/noaa-gfs-analysis/validation/)
        for variable availability, missing data, known quirks, fill values, value
        distributions, and sample plots.\\n\\n### Compression\\n\\nThe data values
        in this dataset have been rounded in their binary floating point representation
        to improve compression. See [Kl\\u00f6wer et al. 2021](https://www.nature.com/articles/s43588-021-00156-2)
        for more information on this approach. The exact number of rounded bits can
        be found in our [reformatting code](https://github.com/dynamical-org/reformatters/blob/main/src/reformatters/noaa/gfs/analysis/template_config.py).\\n\\n###
        Related dataset\\n\\n[NOAA GEFS analysis](/catalog/noaa-gefs-analysis/) provides
        a much longer historical record.\",\n  \"description_model\": \"The Global
        Forecast System (GFS) is a National Oceanic and Atmospheric Administration
        (NOAA) National Centers for Environmental Prediction (NCEP) weather forecast
        model that generates data for dozens of atmospheric and land-soil variables,
        including temperatures, winds, precipitation, soil moisture, and atmospheric
        ozone concentration. The system couples four separate models (atmosphere,
        ocean model, land/soil model, and sea ice) that work together to depict weather
        conditions.\",\n  \"examples\": [\n    {\n      \"title\": \"Temperature at
        a place and time\",\n      \"variants\": [\n        {\n          \"label\":
        \"dynamical-catalog\",\n          \"code\": \"import dynamical_catalog  #
        dynamical-catalog>=0.8.0\\n\\nds = dynamical_catalog.open(\\\"noaa-gfs-analysis\\\",
        chunks=None)\\nds[\\\"temperature_2m\\\"].sel(time=\\\"2026-01-01T00\\\",
        latitude=0, longitude=0)\",\n          \"language\": \"python\"\n        },\n
        \       {\n          \"label\": \"pystac + icechunk\",\n          \"code\":
        \"import icechunk\\nimport pystac\\nimport xarray as xr\\n\\ncatalog = pystac.Catalog.from_file(\\\"https://stac.dynamical.org/catalog.json\\\")\\ncollection
        = catalog.get_child(\\\"noaa-gfs-analysis\\\")\\nasset = collection.assets[\\\"icechunk-https\\\"]\\n\\nrepo
        = icechunk.Repository.open(icechunk.http_storage(asset.href))\\nsession =
        repo.readonly_session(\\\"main\\\")\\n\\nds = xr.open_zarr(session.store,
        chunks=None)\\nds[\\\"temperature_2m\\\"].sel(time=\\\"2026-01-01T00\\\",
        latitude=0, longitude=0)\",\n          \"language\": \"python\"\n        }\n
        \     ]\n    }\n  ],\n  \"cube:dimensions\": {\n    \"latitude\": {\n      \"type\":
        \"spatial\",\n      \"extent\": [\n        -90.0,\n        90.0\n      ],\n
        \     \"axis\": \"y\",\n      \"unit\": \"degree_north\",\n      \"size\":
        721\n    },\n    \"longitude\": {\n      \"type\": \"spatial\",\n      \"extent\":
