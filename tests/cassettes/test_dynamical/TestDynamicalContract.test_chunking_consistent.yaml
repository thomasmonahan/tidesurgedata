        \   \"downward_short_wave_radiation_flux_surface\": {\n      \"dimensions\":
        [\n        \"time\",\n        \"latitude\",\n        \"longitude\"\n      ],\n
        \     \"type\": \"data\",\n      \"chunks\": [\n        1440,\n        50,\n
        \       50\n      ],\n      \"shards\": [\n        1440,\n        400,\n        400\n
        \     ],\n      \"unit\": \"W m-2\",\n      \"long_name\": \"Surface downward
        short-wave radiation flux\",\n      \"standard_name\": \"surface_downwelling_shortwave_flux_in_air\",\n
        \     \"short_name\": \"sdswrf\",\n      \"comment\": \"Average over the previous
        1-6 hours, reset every 6-hour forecast step (00Z, 06Z, 12Z, 18Z).\"\n    },\n
        \   \"geopotential_height_cloud_ceiling\": {\n      \"dimensions\": [\n        \"time\",\n
        \       \"latitude\",\n        \"longitude\"\n      ],\n      \"type\": \"data\",\n
        \     \"chunks\": [\n        1440,\n        50,\n        50\n      ],\n      \"shards\":
