# Nightly smoke tests against real provider APIs. Not run on pull requests.
# On failure, opens (or comments on) an issue labelled `nightly-failure`; when a later run
# passes, that issue is closed automatically.
name: nightly-live

on:
  schedule:
    - cron: "43 3 * * *" # daily 03:43 UTC
  workflow_dispatch:
    inputs:
      force_failure:
        description: Make the canary test fail, to exercise failure notification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Secrets are passed only as environment variables and never printed.
      API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
      TSD_FORCE_LIVE_FAILURE: ${{ inputs.force_failure && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,test]" pytest-rerunfailures
      - name: Run live tests
        # Retry only transient network errors; genuine failures are reported immediately.
        run: >-
          pytest -m live
          --reruns 2 --reruns-delay 30
          --only-rerun "ConnectionError" --only-rerun "Timeout" --only-rerun "HTTPError: 5"
          --junitxml=live-results.xml
      - name: Summarise results
        if: always()
        run: |
          python .github/scripts/live_summary.py live-results.xml > live-summary.md
          cat live-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-summary
          path: live-summary.md
          if-no-files-found: ignore

  notify:
    name: notify
    needs: live
    if: always() && (needs.live.result == 'failure' || needs.live.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.live.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF: ${{ github.ref_name }}
      LABEL: nightly-failure
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: live-summary
      - name: Open, update or close the failure issue
        run: |
          gh label create "$LABEL" --color d93f0b --description "Nightly live job failures" --force
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "failure" ]; then
            {
              echo "The nightly live job failed on \`$REF\`: $RUN_URL"
              echo
              if [ -f live-summary.md ]; then cat live-summary.md; else echo "No test summary was produced."; fi
            } > body.md
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "Nightly live tests failing" --label "$LABEL" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly live job passed again on \`$REF\`: $RUN_URL"
            gh issue close "$number"
          fi
